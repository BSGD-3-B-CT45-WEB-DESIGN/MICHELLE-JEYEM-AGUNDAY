<!DOCTYPE html>
<html>
<head>
    <title>BTS — Hero Page 💜</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: url('BTS_-_Arirang_(cover).png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background: rgba(20, 10, 40, 0.78);
        }
        body::after {
            content: '';
            position: absolute;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(168,85,247,0.18) 0%, transparent 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        .hero {
            position: relative; z-index: 1;
            max-width: 700px; padding: 40px 20px;
        }
        .hero-tag {
            font-size: 12px; letter-spacing: 6px;
            color: #c084fc; text-transform: uppercase; margin-bottom: 16px;
        }
        .hero-title {
            font-size: clamp(36px, 6vw, 72px);
            font-weight: 900; line-height: 1.1; margin-bottom: 20px;
        }
        .hero-title span {
            background: linear-gradient(135deg, #e879f9, #818cf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero-sub {
            font-size: 16px; color: #c4b5fd;
            line-height: 1.8; margin-bottom: 40px;
        }
        .hero-btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
        .btn-primary {
            padding: 14px 32px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: #fff; font-weight: bold; font-size: 15px;
            border: none; border-radius: 10px; cursor: pointer;
            transition: opacity 0.3s, box-shadow 0.3s, transform 0.2s;
            font-family: inherit;
        }
        .btn-primary:hover { opacity: 0.88; box-shadow: 0 0 24px rgba(168,85,247,0.6); transform: translateY(-2px); }
        .btn-outline {
            padding: 14px 32px; background: transparent;
            color: #c084fc; font-weight: bold; font-size: 15px;
            border: 2px solid #a855f7; border-radius: 10px; cursor: pointer;
            transition: all 0.3s; font-family: inherit;
        }
        .btn-outline:hover { background: #a855f7; color: #fff; box-shadow: 0 0 20px rgba(168,85,247,0.5); transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="hero">
        <p class="hero-tag">💜 Now Playing</p>
        <h1 class="hero-title">Feel the <span>Magic</span><br>of BTS</h1>
        <p class="hero-sub">Dive into the universe of 방탄소년단. Experience the music, the message, and the love that connects millions of ARMY around the world.</p>
        <div class="hero-btns">
            <button class="btn-primary">▶ Play Now</button>
            <button class="btn-outline">Explore Discography</button>
        </div>
    </div>
</body>
</html>
